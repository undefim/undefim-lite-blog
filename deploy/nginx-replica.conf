# Dedicated replica origin. Replace replica.example.com and certificate paths before use.
# DNS and TLS are prerequisites; the generated Docker command does not configure either.
# Application port stays bound to 127.0.0.1. If using a CDN, configure trusted real-IP ranges first;
# never trust a client-supplied X-Forwarded-For header directly.
server {
    listen 80;
    server_name replica.example.com;
    location / { return 308 https://replica.example.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name replica.example.com;
    ssl_certificate /etc/letsencrypt/live/replica.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/replica.example.com/privkey.pem;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:4322;
        proxy_set_header Host replica.example.com;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4322;
        proxy_set_header Host replica.example.com;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }
}
